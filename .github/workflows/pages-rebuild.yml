# Asks GitHub Pages to rebuild the site from main. Runs on every push to
# main as a backstop for the automatic Pages build, and can be started
# by hand from the Actions tab (Run workflow).
name: Request Pages rebuild

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"

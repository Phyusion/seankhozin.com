<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neural Network Animation Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ffffff; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; }

    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #neural-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 70%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      color: #1c1917;
    }

    .hero-eyebrow {
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #b08d57;
      margin-bottom: 1rem;
    }

    .hero-name {
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }

    .hero-title {
      font-size: 1.5rem;
      font-weight: 300;
      opacity: 0.8;
      margin-bottom: 1rem;
    }

    .hero-subtitle {
      font-size: 1.1rem;
      opacity: 0.6;
      max-width: 600px;
      margin: 0 auto;
      margin-bottom: 2rem;
    }

    .hero-cta { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-block; padding: 0.7rem 1.8rem; border-radius: 4px;
      text-decoration: none; font-size: 0.95rem; font-weight: 500;
      transition: all 200ms ease;
    }
    .btn-outline {
      background: rgba(30,58,95,0.08); color: #1e3a5f;
      border: 1px solid rgba(30,58,95,0.4);
    }
    .btn-outline:hover {
      background: #1e3a5f; color: #fff; border-color: #1e3a5f;
    }

    .hero-scroll {
      position: absolute; bottom: 3rem; left: 50%; transform: translateX(-50%); z-index: 2;
      opacity: 0; animation: fadeUp 0.8s ease 1s forwards;
    }
    .scroll-indicator {
      width: 24px; height: 40px; border: 2px solid rgba(30,58,95,0.5); border-radius: 12px; position: relative;
    }
    .scroll-indicator::after {
      content: ''; position: absolute; top: 6px; left: 50%; width: 4px; height: 8px;
      background: rgba(30,58,95,0.7); border-radius: 2px; transform: translateX(-50%);
      animation: scrollBounce 1.8s ease-in-out infinite;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes scrollBounce {
      0%, 100% { top: 6px; opacity: 0.4; }
      50% { top: 18px; opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <canvas id="neural-canvas"></canvas>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <p class="hero-eyebrow">Physician-Scientist &bull; Oncologist &bull; AI Innovator</p>
      <h1 class="hero-name">Sean Khozin</h1>
      <p class="hero-title">MD, MPH</p>
      <p class="hero-subtitle">Advancing human health through the convergence of medicine, data science, and artificial intelligence.</p>
      <div class="hero-cta">
        <a href="#" class="btn btn-outline">Learn More</a>
        <a href="#" class="btn btn-outline">Substack</a>
        <a href="#" class="btn btn-outline">Get in Touch</a>
      </div>
    </div>
    <div class="hero-scroll">
      <div class="scroll-indicator"></div>
    </div>
  </div>

  <script>
  (function() {
    const canvas = document.getElementById('neural-canvas');
    const ctx = canvas.getContext('2d');
    let W, H;
    const DPR = window.devicePixelRatio || 1;

    // --- Palette (from site: accent #1e3a5f, gold #b08d57) ---
    const COL = {
      bg:       [255, 255, 255],    // white
      node:     [30, 58, 95],       // accent #1e3a5f
      nodeDim:  [45, 90, 142],      // accent-light
      gold:     [176, 141, 87],     // #b08d57
      goldLight:[160, 120, 60],     // darker gold for white bg
      wire:     [30, 58, 95],       // accent
      signal:   [45, 90, 142],      // accent-light
      formula:  [100, 130, 165],    // muted blue
    };

    function rgba(c, a) { return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * DPR;
      canvas.height = H * DPR;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      buildNetworks();
      buildFormulas();
    }

    // ============================================================
    //  MULTI-LAYER NEURAL NETWORKS
    // ============================================================
    const networks = [];

    function buildNetworks() {
      networks.length = 0;

      // Place 2-3 neural networks at different positions
      const configs = [
        { cx: W * 0.15, cy: H * 0.35, layers: [3, 5, 6, 4, 2], scale: 0.85, rotation: -0.1 },
        { cx: W * 0.82, cy: H * 0.6,  layers: [2, 4, 5, 3],    scale: 0.7,  rotation: 0.15 },
        { cx: W * 0.5,  cy: H * 0.8,  layers: [4, 6, 6, 5, 3], scale: 0.55, rotation: 0.05 },
      ];

      for (const cfg of configs) {
        const net = { nodes: [], connections: [], signals: [], ...cfg };
        const layerCount = cfg.layers.length;
        const layerSpacing = 90 * cfg.scale;
        const nodeSpacing = 50 * cfg.scale;
        const startX = cfg.cx - ((layerCount - 1) * layerSpacing) / 2;

        // Create nodes per layer
        for (let l = 0; l < layerCount; l++) {
          const count = cfg.layers[l];
          const x = startX + l * layerSpacing;
          const startY = cfg.cy - ((count - 1) * nodeSpacing) / 2;
          for (let n = 0; n < count; n++) {
            const y = startY + n * nodeSpacing;
            // Apply rotation
            const dx = x - cfg.cx;
            const dy = y - cfg.cy;
            const cos = Math.cos(cfg.rotation);
            const sin = Math.sin(cfg.rotation);
            net.nodes.push({
              x: cfg.cx + dx * cos - dy * sin,
              y: cfg.cy + dx * sin + dy * cos,
              layer: l,
              index: n,
              radius: (3.5 + Math.random()) * cfg.scale,
              activation: Math.random(),
              pulsePhase: Math.random() * Math.PI * 2,
              weight: (Math.random() * 2 - 1).toFixed(2),
            });
          }
        }

        // Create connections between adjacent layers
        let nodeIdx = 0;
        for (let l = 0; l < layerCount - 1; l++) {
          const currCount = cfg.layers[l];
          const nextCount = cfg.layers[l + 1];
          const currStart = nodeIdx;
          const nextStart = nodeIdx + currCount;
          for (let a = 0; a < currCount; a++) {
            for (let b = 0; b < nextCount; b++) {
              net.connections.push({
                from: currStart + a,
                to: nextStart + b,
                weight: Math.random(),
              });
            }
          }
          nodeIdx += currCount;
        }

        networks.push(net);
      }
    }

    // Spawn signals that travel along connections
    function spawnSignals() {
      for (const net of networks) {
        if (net.signals.length > 25) continue;
        // Pick a random connection
        const conn = net.connections[Math.floor(Math.random() * net.connections.length)];
        net.signals.push({
          conn,
          t: 0,
          speed: 0.006 + Math.random() * 0.01,
          value: (Math.random() * 2 - 1).toFixed(2),
          bright: Math.random() > 0.5,
        });
      }
    }

    // ============================================================
    //  FLOATING MATHEMATICAL FORMULAS
    // ============================================================
    const formulas = [];
    const FORMULA_TEXTS = [
      'f(x) = sigmoid(Wx + b)',
      'L = -1/N \u03A3 y\u1D62 log(\u0177\u1D62)',
      '\u2207W = \u2202L/\u2202W',
      'softmax(z\u1D62) = e^z\u1D62 / \u03A3e^z\u2C7C',
      'ReLU(x) = max(0, x)',
      'h\u209C = tanh(W\u2095h\u209C\u208B\u2081 + W\u2093x\u209C)',
      'P(y|x) = \u03C3(W\u1D40x + b)',
      '\u03B1 = 0.001',
      'W\u209C\u208A\u2081 = W\u209C - \u03B1\u2207L',
      'z = W\u00B7x + b',
      'a = \u03C3(z)',
      '\u03B4\u02E1 = (a\u02E1 - y) \u2299 \u03C3\'(z\u02E1)',
      'J(\u03B8) = 1/2m \u03A3(h\u03B8 - y)\u00B2',
      'GELU(x) = x\u03A6(x)',
      'Attention(Q,K,V)',
      'H(p,q) = -\u03A3 p log q',
      'KL(p||q) = \u03A3 p log(p/q)',
      '\u03C3(x) = 1/(1 + e\u207B\u02E3)',
      'BatchNorm(x) = \u03B3x\u0302 + \u03B2',
      'dropout(x, p=0.5)',
      'Adam: m\u209C = \u03B2\u2081m + (1-\u03B2\u2081)g',
      'LayerNorm(x)',
      'MSE = 1/n \u03A3(y - \u0177)\u00B2',
      'F1 = 2\u00B7P\u00B7R/(P+R)',
      'AUC-ROC',
      'conv2d(x, k, stride=1)',
      'x\u0302 = (x - \u03BC) / \u03C3',
    ];

    function buildFormulas() {
      formulas.length = 0;
      const count = Math.max(18, Math.floor((W * H) / 50000));
      for (let i = 0; i < count; i++) {
        // Initial population: scatter at various distances from center
        formulas.push(createFormula(false));
      }
    }

    function createFormula(startFromCenter) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 0.25 + Math.random() * 0.5;
      const cx = W / 2;
      const cy = H / 2;
      // startFromCenter: spawn right at the middle; otherwise spread out for initial fill
      const dist = startFromCenter ? 0 : (Math.random() * Math.max(W, H) * 0.5);
      return {
        x: cx + Math.cos(angle) * dist,
        y: cy + Math.sin(angle) * dist,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        text: FORMULA_TEXTS[Math.floor(Math.random() * FORMULA_TEXTS.length)],
        opacity: 0,
        maxOpacity: 0.2 + Math.random() * 0.2,
        fadeIn: true,
        fadeSpeed: 0.002 + Math.random() * 0.003,
        size: 11 + Math.floor(Math.random() * 5),
        useGold: Math.random() < 0.25,
      };
    }

    // ============================================================
    //  FLOATING PARTICLES (ambient)
    // ============================================================
    const particles = [];
    function initParticles() {
      particles.length = 0;
      const count = Math.floor((W * H) / 12000);
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * W,
          y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.2,
          vy: (Math.random() - 0.5) * 0.2,
          r: 0.5 + Math.random() * 1.2,
          alpha: 0.1 + Math.random() * 0.25,
          phase: Math.random() * Math.PI * 2,
        });
      }
    }

    // ============================================================
    //  MOUSE INTERACTION
    // ============================================================
    const mouse = { x: -9999, y: -9999 };
    canvas.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    canvas.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

    // ============================================================
    //  ANIMATION LOOP
    // ============================================================
    let frame = 0;

    function update() {
      frame++;

      // Spawn signals periodically
      if (frame % 6 === 0) spawnSignals();

      // Update network signals
      for (const net of networks) {
        for (let i = net.signals.length - 1; i >= 0; i--) {
          net.signals[i].t += net.signals[i].speed;
          if (net.signals[i].t > 1) net.signals.splice(i, 1);
        }
        // Pulse node activations
        for (const node of net.nodes) {
          node.pulsePhase += 0.02;
          node.activation = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(node.pulsePhase));
        }
      }

      // Update formulas
      for (let i = 0; i < formulas.length; i++) {
        const f = formulas[i];
        f.x += f.vx;
        f.y += f.vy;
        if (f.fadeIn) {
          f.opacity += f.fadeSpeed;
          if (f.opacity >= f.maxOpacity) { f.opacity = f.maxOpacity; f.fadeIn = false; }
        } else {
          f.opacity -= f.fadeSpeed * 0.5;
        }
        if (f.opacity <= 0 || f.y < -30 || f.y > H + 30 || f.x < -200 || f.x > W + 200) {
          formulas[i] = createFormula(true);
        }
      }

      // Update particles
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.phase += 0.015;
        if (p.x < -10) p.x = W + 10;
        if (p.x > W + 10) p.x = -10;
        if (p.y < -10) p.y = H + 10;
        if (p.y > H + 10) p.y = -10;

        // Mouse repel
        const dx = p.x - mouse.x;
        const dy = p.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120 && dist > 0) {
          p.vx += (dx / dist) * 0.05;
          p.vy += (dy / dist) * 0.05;
        }
        p.vx *= 0.99;
        p.vy *= 0.99;
      }
    }

    function draw() {
      // Clear with background
      ctx.fillStyle = rgba(COL.bg, 1);
      ctx.fillRect(0, 0, W, H);

      // Subtle gradient overlay for depth
      const grad = ctx.createRadialGradient(W * 0.5, H * 0.4, 0, W * 0.5, H * 0.4, W * 0.7);
      grad.addColorStop(0, rgba([232, 238, 245], 0.5));   // accent-subtle center
      grad.addColorStop(1, rgba(COL.bg, 0));
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // --- Draw ambient particles ---
      for (const p of particles) {
        const flicker = 0.7 + 0.3 * Math.sin(p.phase);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = rgba(COL.nodeDim, p.alpha * flicker);
        ctx.fill();
      }

      // --- Draw formulas ---
      for (const f of formulas) {
        if (f.opacity <= 0.01) continue;
        ctx.font = `${f.size}px 'Courier New', monospace`;
        ctx.fillStyle = f.useGold ? rgba(COL.goldLight, f.opacity) : rgba(COL.formula, f.opacity);
        ctx.fillText(f.text, f.x, f.y);
      }

      // --- Draw neural networks ---
      for (const net of networks) {
        // Draw connections
        for (const conn of net.connections) {
          const a = net.nodes[conn.from];
          const b = net.nodes[conn.to];
          const alpha = 0.06 + conn.weight * 0.08;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = rgba(COL.wire, alpha);
          ctx.lineWidth = 0.6;
          ctx.stroke();
        }

        // Draw signals traveling along connections
        for (const sig of net.signals) {
          const a = net.nodes[sig.conn.from];
          const b = net.nodes[sig.conn.to];
          const px = a.x + (b.x - a.x) * sig.t;
          const py = a.y + (b.y - a.y) * sig.t;
          const fade = sig.t < 0.15 ? sig.t / 0.15 : sig.t > 0.85 ? (1 - sig.t) / 0.15 : 1;

          // Bright trail line behind the signal
          const trailT = Math.max(0, sig.t - 0.15);
          const tx = a.x + (b.x - a.x) * trailT;
          const ty = a.y + (b.y - a.y) * trailT;
          ctx.beginPath();
          ctx.moveTo(tx, ty);
          ctx.lineTo(px, py);
          const trailCol = sig.bright ? COL.gold : COL.signal;
          ctx.strokeStyle = rgba(trailCol, fade * 0.4);
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Signal dot
          ctx.beginPath();
          ctx.arc(px, py, 2.5, 0, Math.PI * 2);
          ctx.fillStyle = rgba(sig.bright ? COL.goldLight : COL.signal, fade * 0.95);
          ctx.fill();

          // Glow
          ctx.beginPath();
          ctx.arc(px, py, 7, 0, Math.PI * 2);
          ctx.fillStyle = rgba(sig.bright ? COL.gold : COL.node, fade * 0.12);
          ctx.fill();

          // Weight value
          if (fade > 0.5) {
            ctx.font = '8px monospace';
            ctx.fillStyle = rgba(COL.signal, fade * 0.5);
            ctx.fillText(sig.value, px + 7, py - 4);
          }
        }

        // Draw nodes
        for (const node of net.nodes) {
          const pulse = 0.6 + 0.4 * Math.sin(node.pulsePhase);
          const r = node.radius;

          // Outer glow
          const glowGrad = ctx.createRadialGradient(node.x, node.y, r, node.x, node.y, r * 5);
          glowGrad.addColorStop(0, rgba(COL.node, 0.1 * pulse));
          glowGrad.addColorStop(1, rgba(COL.node, 0));
          ctx.beginPath();
          ctx.arc(node.x, node.y, r * 5, 0, Math.PI * 2);
          ctx.fillStyle = glowGrad;
          ctx.fill();

          // Node ring
          ctx.beginPath();
          ctx.arc(node.x, node.y, r, 0, Math.PI * 2);
          ctx.fillStyle = rgba(COL.node, 0.15 + 0.35 * node.activation * pulse);
          ctx.fill();
          ctx.strokeStyle = rgba(COL.node, 0.3 + 0.5 * pulse);
          ctx.lineWidth = 1;
          ctx.stroke();

          // Inner bright core
          ctx.beginPath();
          ctx.arc(node.x, node.y, r * 0.45, 0, Math.PI * 2);
          ctx.fillStyle = rgba(COL.signal, 0.5 * node.activation * pulse);
          ctx.fill();
        }

        // Mouse interaction — highlight nearby nodes
        for (const node of net.nodes) {
          const dx = mouse.x - node.x;
          const dy = mouse.y - node.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 150) {
            const alpha = (1 - dist / 150) * 0.3;
            ctx.beginPath();
            ctx.moveTo(node.x, node.y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.strokeStyle = rgba(COL.goldLight, alpha);
            ctx.lineWidth = 0.5;
            ctx.stroke();

            // Show weight
            ctx.font = '9px monospace';
            ctx.fillStyle = rgba(COL.goldLight, alpha);
            ctx.fillText('w=' + node.weight, node.x + node.radius + 5, node.y - 6);
          }
        }
      }

      // --- Vignette ---
      const vig = ctx.createRadialGradient(W * 0.5, H * 0.5, W * 0.25, W * 0.5, H * 0.5, W * 0.8);
      vig.addColorStop(0, 'rgba(255,255,255,0)');
      vig.addColorStop(1, 'rgba(245,245,244,0.5)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, W, H);
    }

    function animate() {
      update();
      draw();
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      resize();
      initParticles();
    });

    resize();
    initParticles();
    animate();
  })();
  </script>
</body>
</html>

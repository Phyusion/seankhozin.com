<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neural Network Animation Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ffffff; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; }

    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #neural-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 70%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      color: #1c1917;
    }

    .hero-eyebrow {
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #b08d57;
      margin-bottom: 1rem;
    }

    .hero-accent-line {
      width: 0; height: 2px; margin: 0 auto 1.5rem;
      background: linear-gradient(90deg, transparent, #b08d57, #d4b98a, transparent);
      opacity: 0; animation: accentDraw 1s ease 0.5s forwards;
    }
    @keyframes accentDraw {
      from { width: 0; opacity: 0; }
      to { width: 80px; opacity: 1; }
    }

    .hero-name {
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
      background: linear-gradient(135deg, #1e3a5f 0%, #2d5a8e 50%, #1e3a5f 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }

    .hero-title {
      font-size: 1.5rem;
      font-weight: 300;
      opacity: 0.8;
      margin-bottom: 1rem;
    }

    .hero-subtitle {
      font-size: 1.1rem;
      opacity: 0.6;
      max-width: 600px;
      margin: 0 auto;
      margin-bottom: 2rem;
    }

    .hero-cta { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-block; padding: 0.7rem 1.8rem; border-radius: 4px;
      text-decoration: none; font-size: 0.95rem; font-weight: 500;
      transition: all 200ms ease;
    }
    .btn-outline {
      background: rgba(30,58,95,0.08); color: #1e3a5f;
      border: 1px solid rgba(30,58,95,0.4);
    }
    .btn-outline:hover {
      background: #1e3a5f; color: #fff; border-color: #1e3a5f;
    }

    .hero-scroll {
      position: absolute; bottom: 3rem; left: 50%; transform: translateX(-50%); z-index: 2;
      opacity: 0; animation: fadeUp 0.8s ease 1s forwards;
    }
    .scroll-indicator {
      width: 24px; height: 40px; border: 2px solid rgba(30,58,95,0.5); border-radius: 12px; position: relative;
    }
    .scroll-indicator::after {
      content: ''; position: absolute; top: 6px; left: 50%; width: 4px; height: 8px;
      background: rgba(30,58,95,0.7); border-radius: 2px; transform: translateX(-50%);
      animation: scrollBounce 1.8s ease-in-out infinite;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes scrollBounce {
      0%, 100% { top: 6px; opacity: 0.4; }
      50% { top: 18px; opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <canvas id="neural-canvas"></canvas>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <p class="hero-eyebrow">Physician-Scientist &bull; Oncologist &bull; AI Innovator</p>
      <div class="hero-accent-line"></div>
      <h1 class="hero-name">Sean Khozin</h1>
      <p class="hero-title">MD, MPH</p>
      <p class="hero-subtitle">Advancing human health through the convergence of medicine, data science, and artificial intelligence.</p>
      <div class="hero-cta">
        <a href="#" class="btn btn-outline">Learn More</a>
        <a href="#" class="btn btn-outline">Substack</a>
        <a href="#" class="btn btn-outline">Get in Touch</a>
      </div>
    </div>
    <div class="hero-scroll">
      <div class="scroll-indicator"></div>
    </div>
  </div>

  <script src="neural-network.js"></script>
</body>
</html>
